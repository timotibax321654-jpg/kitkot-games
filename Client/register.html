<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitkot Games - Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация</h1>
        <p>Создай свой аккаунт</p>
        
        <div id="error-box" class="error-msg"></div>

        <form id="register-form">
            <div class="form-group">
                <label>Имя пользователя (username)</label>
                <input type="text" id="username" required placeholder="Ваш никнейм">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-success">Зарегистрироваться</button>
        </form>

        <span class="link-text">Уже есть аккаунт? <a href="login.html">Войти</a></span>
        <span class="link-text"><a href="index.html">← На главную</a></span>
    </div>

    <script src="toast.js"></script>
    <script src="register.js"></script>
</body>
</html>
